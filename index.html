<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌤️Weather App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #83a4d4, #b6fbff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .weather-card {
      background-color: #a2a0a0cc;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 360px;
      width: 100%;
      transition: 0.3s ease;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #8d9195;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #005ccc;
    }

    .weather-info {
      margin-top: 20px;
      font-size: 16px;
      color: #333;
    }

    .weather-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 10px;
    }

    .temperature {
      font-size: 32px;
      font-weight: bold;
      color: #222;
      margin-top: 10px;
    }

    .description {
      font-style: italic;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="weather-card">
    <h1>🌤️ Live Weather - Nagpur</h1>
    <button onclick="getWeather()">Check Weather</button>
    <div id="weatherInfo" class="weather-info"></div>
  </div>

  <script>
    const API_KEY = "fec45f00e20d257d61d985bddbc48362";

    function getWeather() {
      const weatherDiv = document.getElementById("weatherInfo");
      weatherDiv.innerHTML = "Loading...";

      fetch(`https://api.openweathermap.org/data/2.5/weather?q=Nagpur&appid=${API_KEY}&units=metric`)
        .then(response => response.json())
        .then(data => {
          if (data.cod !== 200) {
            weatherDiv.innerHTML = `<p style="color: red;">Error: ${data.message}</p>`;
            return;
          }

          const iconCode = data.weather[0].icon;
          const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

          const html = `
            <img src="${iconUrl}" alt="Weather Icon" class="weather-icon">
            <div class="temperature">${data.main.temp} °C</div>
            <div class="description">${data.weather[0].description}</div>
            <p><strong>Humidity:</strong> ${data.main.humidity}%</p>
            <p><strong>Wind:</strong> ${data.wind.speed} m/s</p>
          `;

          weatherDiv.innerHTML = html;
        })
        .catch(error => {
          console.error(error);
          weatherDiv.innerHTML = `<p style="color: red;">Failed to load weather data.</p>`;
        });
    }
  </script>

</body>
</html>
